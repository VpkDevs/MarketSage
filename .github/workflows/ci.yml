name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run build
      - run: npm run package -- --skip-build
      - uses: actions/upload-artifact@v4
        with:
          name: marketsage-dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: marketsage-release-zip
          path: |
            release/marketsage-v*.zip
            release/marketsage-v*.zip.sha256
